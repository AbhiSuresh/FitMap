<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1311">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FITMAP"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="icon" href="icon-192.png">
<title>FITMAP</title>
<style>
:root{color-scheme:dark;--ink:#E8EEEA;--paper:#0D1311;--acc:#FF6A2B;--mute:#8A9A93;--line:#26332E;--on:#FF6A2B;--off:#34443E}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:28px;line-height:1.1;margin:8px 0 4px;letter-spacing:-.02em}
h2{font-size:20px;margin:20px 0 6px}
.sub{color:var(--mute);margin:0 0 12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#16201C;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:#9FB0AA;padding:14px 4px;font:600 15px system-ui;cursor:pointer}
nav button.on{color:#fff;box-shadow:inset 0 3px var(--acc)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.days button{flex:0 0 auto;border:1.5px solid var(--line);background:none;border-radius:20px;padding:6px 14px;font:600 14px system-ui;color:var(--ink);cursor:pointer}
.days button.on{background:var(--acc);color:#0D1311;border-color:var(--acc)}
.days button.done::after{content:" ✓";color:var(--acc)}
.ex{border-top:1px solid var(--line)}
.ex>summary{display:flex;gap:12px;align-items:center;padding:12px 0;cursor:pointer;list-style:none}
.ex>summary::-webkit-details-marker{display:none}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--off);background:none;flex:none;cursor:pointer;color:#fff;font-size:15px;line-height:1}
.chk.on{background:var(--on);border-color:var(--on)}
.ex .n{font-weight:650}h1{color:#fff}.ex .p{color:var(--mute);font-size:14px}
.ex .body{padding:0 0 16px 38px}
.ex .body p{margin:8px 0}
.tag{display:inline-block;background:#22302B;border-radius:4px;padding:1px 8px;font-size:13px;margin:0 4px 4px 0}
a.yt{display:inline-block;margin:6px 0;color:var(--ink);font-weight:650;text-decoration-color:var(--acc);text-decoration-thickness:2px;text-underline-offset:3px}
.btn{background:var(--acc);color:#0D1311;border:0;border-radius:8px;padding:12px 18px;font:650 16px system-ui;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border:1.5px solid var(--mute)}
.btn.sm{padding:6px 12px;font-size:14px}
.media{max-width:100%;border-radius:8px;display:block;margin:8px 0}
svg.body{width:100%;max-width:300px;display:block}
.m{fill:#2C3C36}.m.hit{fill:var(--acc)}.torso{fill:#18221E;stroke:#2C3C36}.ana{background:#000;width:100%;max-width:360px}
.big{font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:10px 0}
label{display:block;font-size:14px;color:var(--mute)}
input[type=number]{width:110px;padding:10px;border:1.5px solid var(--mute);border-radius:8px;font:16px system-ui;background:#16201C;color:var(--ink)}
.li{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.cal i{aspect-ratio:1;border-radius:4px;background:var(--off);opacity:.5}
.cal i.on{background:var(--acc);opacity:1}.cal i.rest{opacity:.2}
#inst{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:5}.note{font-size:14px;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.ex .body{animation:o .2s}@keyframes o{from{opacity:0}}}
</style></head><body>
<div id="inst" hidden></div><main id="app"></main>
<nav id="nav"></nav>
<script>
// ---- Data ----
const M={chest:'Chest',shoulders:'Shoulders',biceps:'Biceps',triceps:'Triceps',forearms:'Forearms',abs:'Abs',obliques:'Obliques',quads:'Quads',calves:'Calves',upback:'Upper back',lats:'Lats',glutes:'Glutes',hams:'Hamstrings'};
// id:[name, prescription, muscles, how-to]
const E={
warm:['7-minute dynamic warmup','7 min',['shoulders','abs','glutes','hams'],'2 min brisk flat treadmill walk (4–4.5 km/h), then 1 min each: arm circles, band pull-aparts, standing torso rotations, bodyweight good mornings, supported leg swings. Move smoothly, no bouncing.'],
incp:['Incline dumbbell press','4 × 10–12 · rest 60s · feeder set first',['chest','shoulders','triceps'],'Set the bench to 30°. Shoulder blades pinched back, feet flat. Lower the dumbbells to the sides of your upper chest, then press up without locking your elbows.'],
lat:['Wide-grip lat pulldown','4 × 10–12 · rest 60s',['lats','biceps','upback'],'Grip wider than shoulders, lean back slightly. Pull the bar to your upper chest by driving elbows down. Control it back up; don’t swing.'],
cpress:['Seated chest press machine','3 × 12 · rest 60s',['chest','triceps','shoulders'],'Adjust the seat so handles are at mid-chest. Press forward without shrugging, pause, then return slowly.'],
srow:['Seated cable row (V-handle)','3 × 12 · rest 60s',['upback','lats','biceps'],'Sit tall, knees soft. Pull the handle to your belly, squeezing shoulder blades together. Don’t lean back to cheat.'],
tri:['Cable tricep rope pushdown','3 × 12–15 · rest 45s',['triceps'],'Elbows pinned at your sides. Push the rope down and spread the ends at the bottom. Let it rise only to 90° at the elbow.'],
walk10:['Incline treadmill walk','10 min · 8–10% · 4.5 km/h',['calves','glutes','hams'],'Walk upright without holding the handrails. Take full steps and keep your core braced.'],
leg:['Seated leg press (hip-width)','4 × 10–12 · rest 75s · feeder set first',['quads','glutes'],'Feet hip-width on the plate. Lower until knees reach about 90°, press through the whole foot. Never lock out your knees.'],
rdl:['Dumbbell Romanian deadlift','4 × 10–12 · rest 75s',['hams','glutes'],'Soft knees, dumbbells close to your thighs. Push hips back until you feel a hamstring stretch, back flat, then drive hips forward to stand.'],
lext:['Seated leg extension','3 × 12–15 · rest 60s',['quads'],'Pad on your lower shins. Extend until legs are almost straight, squeeze, and lower slowly.'],
lcurl:['Seated leg curl','3–4 × 12–15 · rest 60s',['hams'],'Pad just above your heels. Curl down and back, hold briefly, and return slowly.'],
calf:['Machine calf raises','3–4 × 15 · rest 45s',['calves'],'Balls of feet on the platform. Rise as high as you can, pause, then lower for a full stretch.'],
sdp:['Seated dumbbell shoulder press','4 × 10–12 · rest 60s · feeder set first',['shoulders','triceps'],'Back against the pad, dumbbells at ear height. Press overhead until arms are nearly straight, then lower under control.'],
cgl:['Close-grip (V-bar) lat pulldown','4 × 10–12 · rest 60s',['lats','biceps','upback'],'Neutral grip, chest up. Pull the handle to your upper chest with elbows close to your ribs.'],
pec:['Pec deck chest fly','3 × 12–15 · rest 60s',['chest','shoulders'],'Elbows slightly bent, arms at chest height. Bring the pads together in front, squeeze, and open slowly.'],
lr:['Standing dumbbell lateral raise','3 × 15 · rest 45s',['shoulders'],'Light weights, slight elbow bend. Raise arms out to shoulder height and lower slowly. No swinging.'],
curl:['Dumbbell bicep curl','3 × 12 · rest 45s',['biceps','forearms'],'Elbows at your sides. Curl up, squeeze, and lower for 2–3 seconds without leaning back.'],
wleg:['Wide-stance seated leg press','4 × 12 · rest 75s · feeder set first',['glutes','quads','hams'],'Feet wider and slightly higher on the plate. Lower with control and push through your heels.'],
abd:['Seated hip abductor machine','3 × 15 · rest 45s',['glutes'],'Sit tall, press knees outward against the pads, pause, and return slowly.'],
inc30:['Incline treadmill intervals','30 min · alternate 5 min 8% / 5 min 10–12%',['calves','glutes','hams','quads'],'Alternate 5 minutes at 8% (4.5 km/h) with 5 minutes at 10–12% (4.2–4.8 km/h). Keep your posture upright and hands off the rails.'],
inc35:['Steady incline walk or walk + bike','35 min · 9–10% at 4.5–5 km/h, or 20 min incline + 15 min bike',['calves','glutes','hams','quads'],'Hold a steady pace you can sustain. Option 2: 20 min at 10% incline, then 15 min on the stationary bike at moderate resistance.'],
kcc:['Kneeling cable crunch','4 × 15 · rest 45s',['abs'],'Kneel under the rope, hold it by your head. Curl your ribs toward your hips, keep hips still, and return slowly.'],
ckr:['Captain’s chair knee raises','3 × 12 · rest 45s',['abs'],'Back against the pad, forearms on the rests. Raise knees toward your chest, then lower slowly without swinging.'],
plank:['Forearm plank','3 × 45 sec · rest 45s',['abs','obliques','shoulders'],'Elbows under shoulders, body in one straight line. Squeeze glutes and abs; don’t let hips sag.'],
pall:['Cable Pallof press','3 × 12 per side · rest 45s',['obliques','abs'],'Stand sideways to the cable, handle at your chest. Press straight out and resist the cable pulling you around, then return.'],
dead:['Deadbug','3 × 10 per side · rest 45s',['abs'],'Lie on your back, arms up, knees at 90°. Lower the opposite arm and leg while your lower back stays on the floor.'],
cool:['Cooldown stretch','5–8 min · hold 30s per side',['chest','quads','hams','calves'],'Hold each stretch gently for 30 seconds per side: chest, shoulders, quads, hamstrings, glutes and calves, as relevant to the day. Breathe slowly.'],
rest:['Easy flat outdoor walk + light stretching','20–30 min',['quads','calves'],'Walk at an easy pace outdoors and finish with light stretching. No gym session today.']
};
const P={
1:['Upper body A + incline walk',['warm','incp','lat','cpress','srow','tri','walk10','cool']],
2:['Lower body (knee-friendly) A',['warm','leg','rdl','lext','lcurl','calf','cool']],
3:['Incline cardio + core A',['warm','inc30','kcc','ckr','plank','cool']],
4:['Upper body hypertrophy + shoulders',['warm','sdp','cgl','pec','lr','curl','walk10','cool']],
5:['Lower body glutes & hamstrings B',['warm','wleg','rdl','lcurl','abd','calf','cool']],
6:['Incline cardio + core B',['warm','inc35','kcc','pall','dead','cool']],
0:['Active recovery & rest',['rest']]};
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
// [muscle, side, cx, cy, rx, ry]
const S=[['shoulders','f',30,42,9,8],['shoulders','f',80,42,9,8],['chest','f',44,55,11,8],['chest','f',66,55,11,8],['biceps','f',21,66,5,11],['biceps','f',89,66,5,11],['forearms','f',17,92,4.5,12],['forearms','f',93,92,4.5,12],['abs','f',55,83,10,15],['obliques','f',38,82,5,12],['obliques','f',72,82,5,12],['quads','f',42,128,9,24],['quads','f',68,128,9,24],['calves','f',42,172,6,16],['calves','f',68,172,6,16],
['shoulders','b',140,42,9,8],['shoulders','b',190,42,9,8],['upback','b',165,50,16,9],['lats','b',151,72,9,14],['lats','b',179,72,9,14],['triceps','b',131,66,5,11],['triceps','b',199,66,5,11],['forearms','b',127,92,4.5,12],['forearms','b',203,92,4.5,12],['glutes','b',155,104,10,9],['glutes','b',175,104,10,9],['hams','b',153,134,9,22],['hams','b',177,134,9,22],['calves','b',153,172,6,16],['calves','b',177,172,6,16]];
function body(ms){let h='<svg class="body" viewBox="0 0 220 195" role="img" aria-label="Muscles worked: '+ms.map(x=>M[x]).join(', ')+'">';
 for(const cx of [55,165]){h+=`<circle class="torso" cx="${cx}" cy="14" r="10"/><rect class="torso" x="${cx-24}" y="34" width="48" height="76" rx="14"/>`}
 for(const[m,s,x,y,rx,ry]of S)h+=`<ellipse class="m${ms.includes(m)?' hit':''}" cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"/>`;
 return h+'<text x="55" y="193" text-anchor="middle" font-size="9" fill="#66736E">Front</text><text x="165" y="193" text-anchor="middle" font-size="9" fill="#66736E">Back</text></svg>'}
function fb(i){const d=document.createElement('div');d.innerHTML=body(i.dataset.ms.split(','));i.replaceWith(d)}
function anat(id,ms){const o=g('ana',{})[id];return `<img class="media ana" src="${o||'anatomy/'+id+'.jpg'}" data-ms="${ms.join(',')}" alt="Muscles worked: ${ms.map(x=>M[x]).join(', ')}" onerror="fb(this)">
  ${o?`<button class="btn alt sm" data-rma="${id}">Use default anatomy image</button>`:`<label class="note" style="cursor:pointer;text-decoration:underline">Use my own anatomy image<input type="file" accept="image/*" data-ana="${id}" hidden></label>`}`}
// ---- Storage ----
const g=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const s=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};
const ds=d=>d.toLocaleDateString('en-CA');
const today=()=>ds(new Date());
let tab='plan',day=new Date().getDay(),openEx=null;
// ---- Streaks ----
function streaks(){const log=g('log',{}),t=new Date();let run=0,best=0;
 for(let i=730;i>=1;i--){const d=new Date(t);d.setDate(t.getDate()-i);if(log[ds(d)]){run++;best=Math.max(best,run)}else if(d.getDay()!==0)run=0}
 if(log[today()]){run++;best=Math.max(best,run)}
 return{cur:run,best,log}}
// ---- Views ----
const $=id=>document.getElementById(id);
function render(){
 $('nav').innerHTML=[['plan','Workouts'],['weight','Weight'],['streak','Streak']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('');
 $('app').innerHTML=tab==='plan'?vPlan():tab==='weight'?vWeight():vStreak();
 if(tab==='plan'&&openEx){const el=document.querySelector(`details[data-e="${openEx}"]`);if(el)el.open=true}}
function vPlan(){const log=g('log',{}),done=g('done',{})[today()]||{};
 const [title,ids]=P[day];const isToday=day===new Date().getDay();
 let h=`<h1>FITMAP</h1><p class="sub">Cult Pro plan. Tap a day, check off exercises, then finish the workout.</p><div class="days">`+
 [1,2,3,4,5,6,0].map(d=>`<button data-d="${d}" class="${d===day?'on':''}${isToday&&d===day&&log[today()]?' done':''}">${DN[d]}</button>`).join('')+`</div><h2>${title}</h2>`;
 const img=g('img',{});
 for(const id of ids){const[n,p,ms,how]=E[id];const dn=isToday&&done[id];
  h+=`<details class="ex" data-e="${id}"><summary>${isToday?`<button class="chk${dn?' on':''}" data-c="${id}" aria-label="Mark ${n} done" aria-pressed="${!!dn}">${dn?'✓':''}</button>`:''}<span><span class="n">${n}</span><br><span class="p">${p}</span></span></summary><div class="body">
  <div>${ms.map(m=>`<span class="tag">${M[m]}</span>`).join('')}</div>${anat(id,ms)}
  <p>${how}</p>
  <a class="yt" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(n+' how to #shorts')}">Watch YouTube Shorts</a>
  ${img[id]?`<img class="media" src="${img[id]}" alt="Your photo of ${n}"><button class="btn alt sm" data-rm="${id}">Remove photo</button>`:`<label class="btn alt sm" style="display:inline-block;color:var(--ink);cursor:pointer">Add photo or GIF<input type="file" accept="image/*" data-up="${id}" hidden></label>`}
  </div></details>`}
 if(isToday)h+=`<p style="margin-top:20px"><button class="btn" data-fin="1">${log[today()]?'Workout logged. Undo':'Finish workout'}</button></p>`;
 else h+=`<p class="note">Checkboxes and logging are available on the current day only.</p>`;
 return h}
function vStreak(){const{cur,best,log}=streaks();const t=new Date();let cells='';
 for(let i=34;i>=0;i--){const d=new Date(t);d.setDate(t.getDate()-i);cells+=`<i class="${log[ds(d)]?'on':d.getDay()===0?'rest':''}" title="${ds(d)}"></i>`}
 return `<h1>Gym streak</h1><p class="sub">Sundays are rest days and never break your streak.</p>
 <div class="big">${cur}</div><p class="sub">${cur===1?'day':'days'} in a row</p><p>Best streak: <b>${best}</b> · Total workouts: <b>${Object.keys(log).length}</b></p>
 <h2>Last 5 weeks</h2><div class="cal">${cells}</div>`}
function bmiCat(b){return b<18.5?'Underweight':b<25?'Healthy range':b<30?'Overweight':'Obesity range'}
function vWeight(){const h=g('h',163),w=g('w',[]),last=w[w.length-1];const m=h/100;
 const bmi=last?last.kg/(m*m):null,lo=(18.5*m*m).toFixed(1),hi=(24.9*m*m).toFixed(1);
 let chart='';
 if(w.length>1){const xs=w.map((_,i)=>i),ys=w.map(e=>e.kg),mn=Math.min(...ys)-1,mx=Math.max(...ys)+1;
  chart=`<svg viewBox="0 0 300 110" style="width:100%" role="img" aria-label="Weight over time"><polyline fill="none" stroke="#FF6A2B" stroke-width="2.5" points="${w.map((e,i)=>`${10+i*(280/(w.length-1))},${100-(e.kg-mn)/(mx-mn)*90}`).join(' ')}"/><text x="4" y="10" font-size="9" fill="#66736E">${mx.toFixed(1)} kg</text><text x="4" y="108" font-size="9" fill="#66736E">${mn.toFixed(1)} kg</text></svg>`}
 return `<h1>Weight &amp; BMI</h1><p class="sub">BMI = weight (kg) ÷ height (m)²</p>
 ${bmi?`<div class="big">${bmi.toFixed(1)}</div><p class="sub">BMI · ${bmiCat(bmi)} · ${last.kg} kg</p>`:'<p class="sub">Add your first weigh-in to see your BMI.</p>'}
 <p class="note">At ${h} cm, a BMI of 18.5–24.9 is ${lo}–${hi} kg.</p>${chart}
 <div class="row"><div><label for="ht">Height (cm)</label><input id="ht" type="number" value="${h}" min="100" max="230"></div>
 <div><label for="wt">Weight (kg)</label><input id="wt" type="number" step="0.1" min="30" max="300" placeholder="80.0"></div><button class="btn" data-addw="1">Add weigh-in</button></div>
 <h2>History</h2>${[...w].reverse().map((e,i)=>`<div class="li"><span>${e.d} · <b>${e.kg} kg</b> · BMI ${(e.kg/(m*m)).toFixed(1)}</span><button class="btn alt sm" data-dw="${w.length-1-i}" aria-label="Delete entry">Delete</button></div>`).join('')||'<p class="note">No entries yet.</p>'}`}
// ---- Events ----
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-t]');if(!t)return;const D=t.dataset;
 if(D.t){tab=D.t;render()}
 else if(D.d!==undefined){day=+D.d;openEx=null;render()}
 else if(D.c){e.preventDefault();const a=g('done',{}),k=today();a[k]=a[k]||{};a[k][D.c]=!a[k][D.c];s('done',a);openEx=null;render()}
 else if(D.fin){const l=g('log',{});l[today()]?delete l[today()]:l[today()]=true;s('log',l);render()}
 else if(D.rm){const i=g('img',{});delete i[D.rm];s('img',i);openEx=D.rm;render()}
 else if(D.rma){const i=g('ana',{});delete i[D.rma];s('ana',i);openEx=D.rma;render()}
 else if(D.addw){const h=+$('ht').value,kg=+$('wt').value;if(h>=100)s('h',h);if(kg>=30){const w=g('w',[]);w.push({d:today(),kg:Math.round(kg*10)/10});s('w',w)}render()}
 else if(D.dw!==undefined){const w=g('w',[]);w.splice(+D.dw,1);s('w',w);render()}});
document.addEventListener('toggle',e=>{if(e.target.dataset?.e&&e.target.open)openEx=e.target.dataset.e},true);
document.addEventListener('change',e=>{const id=e.target.dataset.up||e.target.dataset.ana;if(!id)return;const key=e.target.dataset.ana?'ana':'img';const f=e.target.files[0];if(!f)return;
 const save=u=>{const i=g(key,{});i[id]=u;if(!s(key,i))alert('Not enough storage for this file. Try a smaller image.');openEx=id;render()};
 const r=new FileReader();r.onload=()=>{if(f.type==='image/gif'){r.result.length>1.5e6?alert('This GIF is too large (keep it under about 1 MB).'):save(r.result)}
  else{const im=new Image();im.onload=()=>{const k=Math.min(1,520/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);save(c.toDataURL('image/jpeg',.8))};im.src=r.result}};r.readAsDataURL(f)});
render();
let dip;const sa=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function inst(txt,fn){const b=$('inst');b.innerHTML='<button class="btn sm">'+txt+'</button>';b.hidden=false;b.firstChild.onclick=fn}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(!sa)inst('Install app',async()=>{dip.prompt();await dip.userChoice;$('inst').hidden=true})});
addEventListener('appinstalled',()=>{$('inst').hidden=true});
if(!sa&&/iphone|ipad/i.test(navigator.userAgent))inst('Install',()=>alert('In Safari, tap Share, then Add to Home Screen.'));
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js',{scope:'./'});
</script></body></html>
